name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set git config for tests
        run: git config --global user.email "ci@codewiki.test" && git config --global user.name "ci"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest --cov=codewiki --cov-report=term-missing -p no:cacheprovider tests/ -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Collect changed Python files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            diff_range="${PR_BASE_SHA}...${PR_HEAD_SHA}"
          else
            diff_range="${PUSH_BASE_SHA}..${GITHUB_SHA}"
          fi

          git diff --name-only --diff-filter=ACMR -z "$diff_range" -- '*.py' \
            > "$RUNNER_TEMP/changed-python-files"

      - name: Ruff check changed files
        run: |
          xargs -0 -r uv run ruff check --output-format=github \
            < "$RUNNER_TEMP/changed-python-files"

      - name: Ruff format check changed files
        run: |
          xargs -0 -r uv run ruff format --check \
            < "$RUNNER_TEMP/changed-python-files"

      # Phase-in mypy: only check changed Python files so existing type debt
      # does not block every PR. Full-project baseline has ~650 errors (see
      # .qoder/mypy-baseline.txt); tighten once the baseline is cleaned up.
      # continue-on-error: changed files may still carry legacy errors, so
      # report first and flip to blocking after the debt is burned down.
      - name: Mypy type check changed files
        continue-on-error: true
        run: |
          xargs -0 -r uv run python -m mypy --follow-imports=silent \
            < "$RUNNER_TEMP/changed-python-files"
